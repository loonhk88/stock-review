function b64ToBytes(b64){var s=atob(b64);var b=new Uint8Array(s.length);for(var i=0;i<s.length;i++){b[i]=s.charCodeAt(i);}return b;}
function unlock(){
  var pw=document.getElementById('pw').value;
  var err=document.getElementById('err');
  err.textContent='';
  if(!pw){err.textContent='请输入密码';return;}
  var btn=document.getElementById('go');btn.disabled=true;btn.textContent='解密中…';
  var enc=new TextEncoder();
  crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']).then(function(km){

    var html=new TextDecoder().decode(pt);
    document.open();document.write(html);document.close();
  }).catch(function(e){
    err.textContent='密码错误，请重试';
    btn.disabled=false;btn.textContent='解密查看';
  });
